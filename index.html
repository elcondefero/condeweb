```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030000">
<meta name="description" content="El Conde — enlaces oficiales.">
<title>el conde</title>
<link rel="icon" type="image/png" href="cuervo.png">

<style>
:root{
--r:#ff1738;
--glow:0 0 5px #ff1738,0 0 15px #c00028,0 0 30px #790018;
}

*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
min-height:100%;
background:#030000;
color:var(--r);
font-family:"Courier New",monospace;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow-x:hidden;
background:radial-gradient(ellipse at center,rgba(100,0,20,.2),transparent 68%),#030000;
}

body:before{
content:"";
position:fixed;
inset:0;
z-index:5;
pointer-events:none;
opacity:.16;
background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(255,20,50,.18) 4px,transparent 5px);
}

main{
width:100%;
max-width:1100px;
min-height:100vh;
padding:22px 20px 18px;
display:flex;
flex-direction:column;
align-items:center;
position:relative;
z-index:1;
}

h1{
margin:0;
font-size:clamp(1.5rem,3.5vw,2.5rem);
letter-spacing:.28em;
text-indent:.28em;
text-transform:lowercase;
text-shadow:var(--glow);
animation:flicker 5s infinite;
}

.line{
width:min(300px,70vw);
height:1px;
margin-top:12px;
background:linear-gradient(90deg,transparent,var(--r),transparent);
box-shadow:0 0 9px var(--r);
}

.stage{
width:min(680px,94vw);
height:540px;
margin:5px auto 0;
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.orbit{
position:absolute;
left:50%;
top:50%;
border:1px solid rgba(255,24,56,.3);
border-radius:50%;
transform:translate(-50%,-50%);
pointer-events:none;
}

.o1{width:290px;height:290px;box-shadow:0 0 16px rgba(255,0,40,.08),inset 0 0 16px rgba(255,0,40,.06)}
.o2{width:430px;height:430px;border-style:dashed;opacity:.5}
.o3{width:540px;height:540px;opacity:.2}

.logo{
position:absolute;
left:50%;
top:50%;
width:210px;
height:210px;
transform:translate(-50%,-50%);
display:grid;
place-items:center;
border-radius:50%;
background:radial-gradient(circle,rgba(92,0,17,.24),rgba(0,0,0,.94) 70%);
border:1px solid rgba(255,24,56,.56);
box-shadow:0 0 24px rgba(255,0,40,.19),inset 0 0 25px rgba(255,0,40,.12);
}

.logo:before,.logo:after{
content:"";
position:absolute;
inset:-9px;
border:1px solid rgba(255,24,56,.3);
border-radius:50%;
}

.logo:after{
inset:-17px;
border-style:dashed;
opacity:.6;
}

.logo img{
width:88%;
height:88%;
object-fit:contain;
filter:drop-shadow(0 0 7px rgba(255,0,35,.6));
position:relative;
z-index:1;
}

.social{
position:absolute;
left:50%;
top:50%;
width:70px;
height:70px;
margin:-35px 0 0 -35px;
display:grid;
place-items:center;
color:var(--r);
text-decoration:none;
border:1px solid rgba(255,24,56,.7);
border-radius:50%;
background:rgba(7,0,2,.94);
box-shadow:0 0 10px rgba(255,0,40,.25),inset 0 0 13px rgba(255,0,40,.12);
transition:background .22s,box-shadow .22s,transform .22s;
}

.social svg{
width:30px;
height:30px;
fill:none;
stroke:currentColor;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round;
filter:drop-shadow(0 0 5px rgba(255,0,40,.9));
}

.social .solid{fill:currentColor;stroke:none}

.social:hover,.social:focus-visible{
outline:none;
background:rgba(95,0,18,.9);
box-shadow:var(--glow),inset 0 0 16px rgba(255,0,40,.25);
}

.social span{
position:absolute;
top:calc(100% + 9px);
left:50%;
transform:translateX(-50%);
white-space:nowrap;
font-size:11px;
letter-spacing:.13em;
color:#ff5268;
text-shadow:0 0 7px #c00028;
}

/* Posiciones simétricas alrededor del logo */

.youtube{transform:translate(-50%,-50%) translateY(-215px)}
.instagram{transform:translate(-50%,-50%) translateX(215px)}
.facebook{transform:translate(-50%,-50%) translateY(215px)}
.x-social{transform:translate(-50%,-50%) translateX(-215px)}
.email{transform:translate(-50%,-50%) translate(152px,-152px)}

.youtube:hover{transform:translate(-50%,-50%) translateY(-215px) scale(1.1)}
.instagram:hover{transform:translate(-50%,-50%) translateX(215px) scale(1.1)}
.facebook:hover{transform:translate(-50%,-50%) translateY(215px) scale(1.1)}
.x-social:hover{transform:translate(-50%,-50%) translateX(-215px) scale(1.1)}
.email:hover{transform:translate(-50%,-50%) translate(152px,-152px) scale(1.1)}

.email{
cursor:default;
}

.email span{
pointer-events:none;
}

footer{
margin-top:auto;
padding-top:10px;
color:rgba(255,24,56,.5);
font-size:10px;
letter-spacing:.25em;
text-align:center;
}

@keyframes flicker{
0%,18%,22%,62%,64%,100%{opacity:1}
20%,63%{opacity:.82}
}

/* Adaptación para móviles */

@media(max-width:650px){

main{
min-height:100vh;
padding:30px 12px 20px;
}

.stage{
width:100%;
height:auto;
margin-top:30px;
display:grid;
grid-template-columns:repeat(3,minmax(76px,1fr));
justify-items:center;
gap:32px 8px;
}

.orbit{display:none}

.logo{
position:relative;
left:auto;
top:auto;
transform:none;
grid-column:1/-1;
grid-row:1;
width:min(190px,55vw);
height:min(190px,55vw);
margin-bottom:8px;
}

.social{
position:relative;
left:auto;
top:auto;
margin:0;
transform:none!important;
width:68px;
height:68px;
}

.youtube{grid-column:1;grid-row:2}
.instagram{grid-column:2;grid-row:2}
.email{grid-column:3;grid-row:2}
.facebook{grid-column:1;grid-row:3}
.x-social{grid-column:3;grid-row:3}

.social:hover,.social:focus-visible{
transform:scale(1.08)!important;
}

footer{
margin-top:45px;
}
}

@media(max-height:650px) and (min-width:651px){
main{padding-top:12px;padding-bottom:10px}
.stage{height:450px}
.o3{width:440px;height:440px}
}

@media(prefers-reduced-motion:reduce){
*,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
