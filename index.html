<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> el conde </title>
    <!-- Favicon en la pestaña del navegador -->
    <link rel="icon" type="image/png" href="cuervo.png">
    <!-- Fuente estilo Hacker / Terminal -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-core: #ff0033;
            --red-glow: rgba(255, 0, 51, 0.75);
            --red-dim: rgba(255, 0, 51, 0.2);
            --bg-dark: #030000;
            --orbit-radius: 210px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--red-core);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Efecto de líneas de escaneo holográfico (CRT Scanlines) */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.45) 0px,
                rgba(0, 0, 0, 0.45) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 10;
        }

        /* Viñeta oscura en los bordes */
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 45%, #000000 100%);
            pointer-events: none;
            z-index: 9;
        }

        /* Contenedor Principal Orbital */
        .hologram-hub {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: holo-flicker 5s infinite;
        }

        /* Anillos holográficos decorativos */
        .orbit-ring {
            position: absolute;
            width: calc(var(--orbit-radius) * 2);
            height: calc(var(--orbit-radius) * 2);
            border: 1px dashed var(--red-dim);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.1), inset 0 0 20px rgba(255, 0, 51, 0.1);
            animation: spin-slow 40s linear infinite;
            pointer-events: none;
        }

        .orbit-ring-inner {
            position: absolute;
            width: 270px;
            height: 270px;
            border: 1px solid rgba(255, 0, 51, 0.15);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Logo Central (cuervo.png) */
        .center-logo {
            position: relative;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            filter: drop-shadow(0 0 12px var(--red-glow));
            animation: pulse-logo 3s ease-in-out infinite alternate;
        }

        .center-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        /* Nodos de Redes Sociales (Simetría radial de 5 puntos: 72 grados c/u) */
        .social-node {
            position: absolute;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(15, 0, 3, 0.85);
            border: 1.5px solid var(--red-core);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--red-core);
            text-decoration: none;
            cursor: pointer;
            z-index: 6;
            box-shadow: 0 0 12px var(--red-dim), inset 0 0 8px var(--red-dim);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            
            /* Posicionamiento trigonométrico simétrico */
            --angle: calc(var(--i) * 72deg - 90deg);
            transform: rotate(var(--angle)) translate(var(--orbit-radius)) rotate(calc(-1 * var(--angle)));
        }

        .social-node svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
            filter: drop-shadow(0 0 5px var(--red-glow));
            transition: transform 0.3s ease;
        }

        /* Efecto Hover Holográfico */
        .social-node:hover {
            background: rgba(255, 0, 51, 0.2);
            box-shadow: 0 0 25px var(--red-core), inset 0 0 15px var(--red-core);
            transform: rotate(var(--angle)) translate(var(--orbit-radius)) rotate(calc(-1 * var(--angle))) scale(1.18);
        }

        .social-node:hover svg {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px #ffffff);
        }

        /* Caja Holográfica para el correo Gmail */
        .gmail-popup {
            position: fixed;
            bottom: 45px;
            background: rgba(12, 0, 2, 0.92);
            border: 1px solid var(--red-core);
            padding: 14px 26px;
            border-radius: 4px;
            box-shadow: 0 0 20px var(--red-glow), inset 0 0 10px var(--red-dim);
            color: var(--red-core);
            font-size: 1.15rem;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--red-core);
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: all 0.3s ease;
            z-index: 20;
            cursor: pointer;
        }

        .gmail-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            animation: glitch-text 0.3s ease;
        }

        .gmail-popup:hover {
            background: rgba(255, 0, 51, 0.15);
            box-shadow: 0 0 30px var(--red-core);
        }

        .copy-badge {
            font-size: 0.75rem;
            border: 1px solid var(--red-core);
            padding: 2px 6px;
            text-transform: uppercase;
        }

        /* Animaciones */
        @keyframes holo-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
            }
            20%, 24%, 55% {
                opacity: 0.82;
            }
            22% {
                opacity: 0.65;
            }
        }

        @keyframes pulse-logo {
            0% {
                filter: drop-shadow(0 0 10px rgba(255, 0, 51, 0.6));
                transform: scale(0.98);
            }
            100% {
                filter: drop-shadow(0 0 22px rgba(255, 0, 51, 0.95));
                transform: scale(1.02);
            }
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes glitch-text {
            0% { transform: translate(0); }
            25% { transform: translate(-3px, 2px); }
            50% { transform: translate(3px, -2px); }
            75% { transform: translate(-2px, -1px); }
            100% { transform: translate(0); }
        }

        /* Responsivo para pantallas móviles */
        @media (max-width: 550px) {
            :root {
                --orbit-radius: 145px;
            }
            .hologram-hub {
                width: 340px;
                height: 340px;
            }
            .center-logo {
                width: 145px;
                height: 145px;
            }
            .orbit-ring-inner {
                width: 185px;
                height: 185px;
            }
            .social-node {
                width: 46px;
                height: 46px;
            }
            .social-node svg {
                width: 21px;
                height: 21px;
            }
            .gmail-popup {
                font-size: 0.95rem;
                padding: 10px 18px;
            }
        }
    </style>
</head>
<body>

    <div class="hologram-hub">
        <!-- Anillos holográficos -->
        <div class="orbit-ring"></div>
        <div class="orbit-ring-inner"></div>

        <!-- Logo Central -->
        <div class="center-logo">
            <img src="cuervo.png" alt="Logo Central">
        </div>

        <!-- 1. YouTube (Arriba) -->
        <a href="https://www.youtube.com/@elconde_fero" target="_blank" rel="noopener noreferrer" class="social-node" style="--i: 0;" aria-label="YouTube">
            <svg viewBox="0 0 24 24">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
        </a>

        <!-- 2. Instagram (Superior Derecha) -->
        <a href="https://www.instagram.com/elcondefero/" target="_blank" rel="noopener noreferrer" class="social-node" style="--i: 1;" aria-label="Instagram">
            <svg viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
        </a>

        <!-- 3. X / Twitter (Inferior Derecha) -->
        <a href="https://x.com/elcondefero" target="_blank" rel="noopener noreferrer" class="social-node" style="--i: 2;" aria-label="X">
            <svg viewBox="0 0 24 24">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
        </a>

        <!-- 4. Facebook (Inferior Izquierda) -->
        <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" class="social-node" style="--i: 3;" aria-label="Facebook">
            <svg viewBox="0 0 24 24">
                <path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/>
            </svg>
        </a>

        <!-- 5. Gmail (Superior Izquierda - Muestra el correo sin redirigir) -->
        <button type="button" id="gmail-btn" class="social-node" style="--i: 4;" aria-label="Gmail">
            <svg viewBox="0 0 24 24">
                <path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/>
            </svg>
        </button>
    </div>

    <!-- Display Holográfico del correo -->
    <div id="gmail-display" class="gmail-popup" title="Clic para copiar">
        <span id="email-text">elcondefero@gmail.com</span>
        <span id="copy-status" class="copy-badge">COPIAR</span>
    </div>

    <script>
        const gmailBtn = document.getElementById('gmail-btn');
        const gmailDisplay = document.getElementById('gmail-display');
        const copyStatus = document.getElementById('copy-status');
        const emailText = document.getElementById('email-text').innerText;

        gmailBtn.addEventListener('click', () => {
            gmailDisplay.classList.toggle('active');
            copyStatus.innerText = 'COPIAR';
        });

        gmailDisplay.addEventListener('click', () => {
            navigator.clipboard.writeText(emailText).then(() => {
                copyStatus.innerText = 'COPIADO';
                setTimeout(() => {
                    copyStatus.innerText = 'COPIAR';
                }, 2000);
            });
        });
    </script>
</body>
</html>
